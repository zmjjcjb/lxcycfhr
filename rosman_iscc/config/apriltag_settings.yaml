# AprilTag 连续检测参数。
# 本文件会被 iscc_rosman_launch.launch 加载到 apriltag_ros_continuous_node 名下，
# 主要影响三件事：
# 1. 检测速度是否足够快
# 2. 远处/小尺寸 Tag 是否容易漏检
# 3. 误检率、位姿稳定性和资源占用
tag_family: 'tag36h11'

# 检测线程数。
# 一般越大越快，但也会占用更多 CPU；通常设为 CPU 核数或略小于核数较合适。
# 如果机器算力吃紧、别的节点也很多，线程开太大反而可能拖慢整机。
tag_threads: 3

# 图像降采样倍数。
# - 1.0: 不降采样，最稳但最慢
# - >1.0: 先缩小图像再检测，速度更快，但远处/小尺寸 Tag 更容易漏检
# 想提升检测速度时，通常优先尝试把它从 1.0 调到 1.5 或 2.0。
tag_decimate: 1.0

# 检测前对图像做的高斯模糊强度。
# - 0.0: 不模糊，边缘最清晰
# - 稍大一点: 可以压噪声，但会让边缘发虚，小 Tag 更难识别
# 一般只有图像噪声很重时才考虑增大，默认 0.0 通常最稳。
tag_blur: 0.0

# 是否做边缘精修。
# - 1: 识别更稳、角点更准，但会稍慢
# - 0: 更快一点，但边缘/角点精度会下降
# 如果只是想极限提速，可以尝试关掉；正常比赛更建议保持 1。
tag_refine_edges: 1

# AprilTag 底层调试开关。
# - 0: 正常运行
# - 1: 输出调试信息/调试图，主要用于底层排查
# 正常使用建议保持 0，否则会增加额外开销。
tag_debug: 0

# 最大汉明纠错距离。
# 值越大，对有损/模糊 Tag 的容错越强，但计算量和内存占用也会上升。
# 一般 2 是比较常用的折中；>=3 往往代价明显变大，不建议轻易使用。
max_hamming_dist: 2

# 是否发布每个 Tag 的 TF 变换。
# - true: 会发布坐标变换，便于 RViz/TF 链使用，但会多一些开销
# - false: 只保留检测结果话题，略省资源
# 如果你的流程只看 /tag_detections，不依赖 TF，可以考虑关掉来减轻负担。
publish_tf: false

# image_transport 传输方式。
# 常见值：
# - raw: 原始图像，延迟最低，最适合检测
# - compressed: 带压缩，省带宽但会增加解码开销，且可能影响图像质量
# 本地机内检测一般优先用 raw。
transport_hint: "raw"
